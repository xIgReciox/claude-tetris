<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <label class="theme-toggle">
      <input type="checkbox" id="theme-toggle" />
      <span class="switch"></span>
      <span>Modo claro</span>
    </label>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section" id="records-panel">
          <span class="label">RECORDS</span>
          <ol class="records-list" id="records-list"></ol>
          <div class="records-extra">Mejor combo: <b id="best-combo">0</b></div>
          <div class="records-extra">Máx. líneas: <b id="best-lines">0</b></div>
          <button id="clear-records-btn" type="button">Borrar records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="hidden">
          <p id="gameover-combo"></p>
          <div id="name-entry" class="hidden">
            <label for="name-input">¡Nuevo record! Tu nombre:</label>
            <div class="name-row">
              <input type="text" id="name-input" maxlength="12" autocomplete="off" placeholder="Jugador" />
              <button id="save-record-btn" type="button">Guardar</button>
            </div>
          </div>
          <ol class="records-list" id="gameover-list"></ol>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
